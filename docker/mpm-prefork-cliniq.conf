# Explicit production baseline for the current single-container Apache/PHP tier.
# This is sized for the measured enrollment burst while keeping connections
# bounded; revisit after the next staged run before adding replicas.
ServerLimit             300
StartServers              10
MinSpareServers           10
MaxSpareServers           30
MaxRequestWorkers       300
MaxConnectionsPerChild 2000
KeepAlive                 On
MaxKeepAliveRequests    100
KeepAliveTimeout           2
