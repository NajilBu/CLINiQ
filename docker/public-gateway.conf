map $request_method $cliniq_legacy_portal_redirect {
    default 0;
    GET 1;
    HEAD 1;
}

map $uri $cliniq_clean_portal_url {
    /patient-portal/index.php                    /;
    /patient-portal/patient-welcome.php          /;
    /patient-portal/patient-login.php            /login;
    /patient-portal/patient-register.php         /signup;
    /patient-portal/patient-forgot-password.php  /forgot-password;
    /patient-portal/patient-reset-password.php   /reset-password;
    /patient-portal/patient-onboarding.php       /onboarding;
    /patient-portal/patient-dashboard.php        /dashboard;
    /patient-portal/patient-ape-status.php       /ape-status;
    /patient-portal/patient-ape-document.php     /ape-document;
    /patient-portal/patient-appointment.php      /appointments;
    /patient-portal/patient-passport.php         /health-passport;
    /patient-portal/patient-help.php             /help;
    /patient-portal/patient-feedback.php         /feedback;
    /patient-portal/patient-feedback-consent.php /feedback/consent;
    /patient-portal/patient-nfc-authorize.php    /nfc-authorize;
    /patient-portal/patient-notifications.php    /notifications;
    /patient-portal/update-profile-photo.php     /profile-photo;
}

server {
    listen 8081;
    server_name _;

    server_tokens off;
    absolute_redirect off;
    client_max_body_size 25m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cliniq_app_upstream app:80;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / {
        proxy_pass http://$cliniq_app_upstream/patient-portal/patient-welcome.php$is_args$args;
        include /etc/nginx/proxy_params;
    }

    location = /patient-portal {
        return 301 /;
    }

    location = /login { proxy_pass http://$cliniq_app_upstream/patient-portal/patient-login.php$is_args$args; include /etc/nginx/proxy_params; }
    location = /signup { proxy_pass http://$cliniq_app_upstream/patient-portal/patient-register.php$is_args$args; include /etc/nginx/proxy_params; }
    location = /forgot-password { proxy_pass http://$cliniq_app_upstream/patient-portal/patient-forgot-password.php$is_args$args; include /etc/nginx/proxy_params; }
    location = /reset-password { proxy_pass http://$cliniq_app_upstream/patient-portal/patient-reset-password.php$is_args$args; include /etc/nginx/proxy_params; }
    location = /onboarding { proxy_pass http://$cliniq_app_upstream/patient-portal/patient-onboarding.php$is_args$args; include /etc/nginx/proxy_params; }
    location = /dashboard { proxy_pass http://$cliniq_app_upstream/patient-portal/patient-dashboard.php$is_args$args; include /etc/nginx/proxy_params; }
    location = /ape-status { proxy_pass http://$cliniq_app_upstream/patient-portal/patient-ape-status.php$is_args$args; include /etc/nginx/proxy_params; }
    location = /ape-document { proxy_pass http://$cliniq_app_upstream/patient-portal/patient-ape-document.php$is_args$args; include /etc/nginx/proxy_params; }
    location = /appointments { proxy_pass http://$cliniq_app_upstream/patient-portal/patient-appointment.php$is_args$args; include /etc/nginx/proxy_params; }
    location = /health-passport { proxy_pass http://$cliniq_app_upstream/patient-portal/patient-passport.php$is_args$args; include /etc/nginx/proxy_params; }
    location = /help { proxy_pass http://$cliniq_app_upstream/patient-portal/patient-help.php$is_args$args; include /etc/nginx/proxy_params; }
    location = /feedback { proxy_pass http://$cliniq_app_upstream/patient-portal/patient-feedback.php$is_args$args; include /etc/nginx/proxy_params; }
    location = /feedback/consent { proxy_pass http://$cliniq_app_upstream/patient-portal/patient-feedback-consent.php$is_args$args; include /etc/nginx/proxy_params; }
    location = /nfc-authorize { proxy_pass http://$cliniq_app_upstream/patient-portal/patient-nfc-authorize.php$is_args$args; include /etc/nginx/proxy_params; }
    location = /notifications { proxy_pass http://$cliniq_app_upstream/patient-portal/patient-notifications.php$is_args$args; include /etc/nginx/proxy_params; }
    location = /profile-photo { proxy_pass http://$cliniq_app_upstream/patient-portal/update-profile-photo.php$is_args$args; include /etc/nginx/proxy_params; }

    location ~ ^/patient-portal/(?:index|patient-(?:welcome|login|register|forgot-password|reset-password|onboarding|dashboard|ape-status|ape-document|appointment|passport|help|feedback|feedback-consent|nfc-authorize|notifications)|update-profile-photo)\.php$ {
        if ($cliniq_legacy_portal_redirect) {
            return 301 $cliniq_clean_portal_url$is_args$args;
        }
        proxy_pass http://$cliniq_app_upstream;
        include /etc/nginx/proxy_params;
    }

    location /patient-portal/ {
        proxy_pass http://$cliniq_app_upstream;
        include /etc/nginx/proxy_params;
    }

    location = /public/emergency.php {
        proxy_pass http://$cliniq_app_upstream;
        include /etc/nginx/proxy_params;
    }

    location = /public/clinic-feedback.php {
        proxy_pass http://$cliniq_app_upstream;
        include /etc/nginx/proxy_params;
    }

    location ^~ /public/legal/ {
        proxy_pass http://$cliniq_app_upstream;
        include /etc/nginx/proxy_params;
    }

    location = /public/index.php {
        return 301 /;
    }

    location ^~ /public/assets/ {
        proxy_pass http://$cliniq_app_upstream;
        include /etc/nginx/proxy_params;
    }

    location ^~ /public/uploads/settings/ {
        proxy_pass http://$cliniq_app_upstream;
        include /etc/nginx/proxy_params;
    }

    location ^~ /public/uploads/profile-photos/ {
        proxy_pass http://$cliniq_app_upstream;
        include /etc/nginx/proxy_params;
    }

    location / {
        return 404;
    }
}
