ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.php

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <LocationMatch "^/(app|database|docker|electron|scripts|storage|tests|tools|tmp|outputs)(/|$)">
        Require all denied
    </LocationMatch>

    <FilesMatch "(^\.|\.(sql|ini|log|yml|yaml|toml|lock|md)$)">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/cliniq-error.log
    CustomLog ${APACHE_LOG_DIR}/cliniq-access.log combined
</VirtualHost>
