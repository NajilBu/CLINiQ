services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: Cliniq_db
      MARIADB_USER: cliniq_proof
      MARIADB_PASSWORD: cliniq_proof
      MARIADB_ROOT_PASSWORD: cliniq_proof_root
    tmpfs:
      - /var/lib/mysql
    volumes: !reset
      - ./database/production_schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks:
      - cliniq_internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.21
    networks:
      - cliniq_internal
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["php", "/var/www/html/scripts/database/migrate.php", "--apply"]
    environment:
      APP_ENV: development
      DB_HOST: database
      DB_PORT: 3306
      AUTH_DB_NAME: Cliniq_db
      DB_USER: cliniq_proof
      DB_PASS: cliniq_proof
    depends_on:
      database:
        condition: service_healthy
    networks:
      - cliniq_internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports: !reset []
    environment:
      APP_ENV: development
      APP_URL: http://app/public
      PATIENT_PORTAL_URL: http://app/patient-portal
      APP_TIMEZONE: Asia/Manila
      SESSION_SECURE_COOKIE: "false"
      DB_HOST: database
      DB_PORT: 3306
      AUTH_DB_NAME: Cliniq_db
      DB_USER: cliniq_proof
      DB_PASS: cliniq_proof
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USER: proof
      MAIL_PASS: proof
      MAIL_FROM: proof@plpasig.edu.ph
      MAIL_FROM_NAME: CLINiQ Proof
      MAIL_ENCRYPTION: none
      MAIL_CAPACITY_INITIAL: 100
      MAIL_CAPACITY_MAX: 100
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    networks:
      - cliniq_internal
    volumes: !override ["./tests:/proof:ro"]
    tmpfs:
      - /var/www/html/storage/documents
      - /var/www/html/public/uploads
      - /var/lib/php/sessions
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/patient-portal/patient-register.php"]
      interval: 5s
      timeout: 3s
      retries: 30

networks:
  cliniq_internal:
    name: cliniq-registration-proof
    driver: bridge
