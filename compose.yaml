services:
  app:
    image: cliniq-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - docker/.env
    environment:
      MARIADB_ROOT_PASSWORD: ""
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - cliniq_documents:/var/www/html/storage/documents
      - cliniq_uploads:/var/www/html/public/uploads
      - cliniq_backups:/var/backups/cliniq
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/public/api/health.php"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cliniq_internal

  backup:
    image: cliniq-app:latest
    restart: unless-stopped
    entrypoint: ["/var/www/html/scripts/backup/container_scheduler.sh"]
    env_file:
      - docker/.env
    environment:
      MARIADB_ROOT_PASSWORD: ""
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - cliniq_documents:/var/www/html/storage/documents:ro
      - cliniq_uploads:/var/www/html/public/uploads:ro
      - cliniq_backups:/var/backups/cliniq
    networks:
      - cliniq_internal

  restore-test:
    image: cliniq-app:latest
    profiles: ["maintenance"]
    restart: "no"
    entrypoint: ["php", "/var/www/html/scripts/backup/container_restore_test.php"]
    env_file:
      - docker/.env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - cliniq_backups:/var/backups/cliniq
    networks:
      - cliniq_internal

  gateway:
    image: nginx:1.27-alpine
    profiles: ["quick-tunnel"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./docker/public-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/proxy_params:/etc/nginx/proxy_params:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - cliniq_internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["quick-tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://gateway:8080
    depends_on:
      - gateway
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - cliniq_internal

  database:
    image: mariadb:11.4
    restart: unless-stopped
    env_file:
      - docker/.env
    volumes:
      - cliniq_database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - cliniq_internal

volumes:
  cliniq_database:
  cliniq_documents:
  cliniq_uploads:
  cliniq_backups:

networks:
  cliniq_internal:
    driver: bridge
