services:
  app:
    image: cliniq-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - docker/.env
    environment:
      MARIADB_ROOT_PASSWORD: ""
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - cliniq_documents:/var/www/html/storage/documents
      - cliniq_uploads:/var/www/html/public/uploads
      - cliniq_backups:/var/backups/cliniq
      - cliniq_sessions:/var/lib/php/sessions
      # Development placeholder only. Production must mount a prepared encrypted external drive.
      - ${BACKUP_EXTERNAL_HOST_PATH:-./external-backups}:/var/backups/external
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/public/api/health.php"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cliniq_internal

  backup:
    image: cliniq-app:latest
    restart: unless-stopped
    entrypoint: ["/var/www/html/scripts/backup/container_scheduler.sh"]
    env_file:
      - docker/.env
    environment:
      MARIADB_ROOT_PASSWORD: ""
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - cliniq_documents:/var/www/html/storage/documents:ro
      - cliniq_uploads:/var/www/html/public/uploads:ro
      - cliniq_backups:/var/backups/cliniq
      # Development placeholder only. Production must mount a prepared encrypted external drive.
      - ${BACKUP_EXTERNAL_HOST_PATH:-./external-backups}:/var/backups/external
    networks:
      - cliniq_internal

  email-worker:
    image: cliniq-app:latest
    restart: unless-stopped
    command: ["/var/www/html/scripts/email/worker.sh"]
    env_file:
      - docker/.env
    environment:
      MARIADB_ROOT_PASSWORD: ""
    depends_on:
      database:
        condition: service_healthy
    networks:
      - cliniq_internal

  restore-test:
    image: cliniq-app:latest
    profiles: ["maintenance"]
    restart: "no"
    entrypoint: ["php", "/var/www/html/scripts/backup/container_restore_test.php"]
    env_file:
      - docker/.env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - cliniq_backups:/var/backups/cliniq
      # Development placeholder only. Production must mount a prepared encrypted external drive.
      - ${BACKUP_EXTERNAL_HOST_PATH:-./external-backups}:/var/backups/external:ro
    networks:
      - cliniq_internal

  loadtest:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    restart: "no"
    user: "0:0"
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: ${LOAD_TEST_BASE_URL:-http://app}
      STUDENT_ID: ${LOAD_TEST_STUDENT_ID:-}
      STUDENT_PASSWORD: ${LOAD_TEST_STUDENT_PASSWORD:-}
      ADMIN_BASE_URL: ${LOAD_TEST_ADMIN_BASE_URL:-}
      ADMIN_COOKIE: ${LOAD_TEST_ADMIN_COOKIE:-}
      LOAD_TEST_ALLOW_PRODUCTION: ${LOAD_TEST_ALLOW_PRODUCTION:-0}
    command: ["run", "--summary-export=/results/enrollment-surge-summary.json", "/scripts/enrollment-surge.js"]
    volumes:
      - ./tests/load:/scripts:ro
      - cliniq_load_test_results:/results
    networks:
      - cliniq_internal

  gateway:
    image: nginx:1.27-alpine
    profiles: ["public-portal", "quick-tunnel"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./docker/public-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/proxy_params:/etc/nginx/proxy_params:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - cliniq_internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["public-portal"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /etc/cloudflared/tunnel-token
    depends_on:
      - gateway
    volumes:
      - ./docker/cloudflared:/etc/cloudflared:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - cliniq_internal

  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    profiles: ["quick-tunnel"]
    restart: "no"
    command: tunnel --no-autoupdate --url http://gateway:8081
    depends_on:
      - gateway
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - cliniq_internal

  database:
    image: mariadb:11.4
    restart: unless-stopped
    env_file:
      - docker/.env
    volumes:
      - cliniq_database:/var/lib/mysql
      - ./docker/mariadb.cnf:/etc/mysql/conf.d/cliniq.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - cliniq_internal

volumes:
  cliniq_database:
    name: cliniq_cliniq_database
    external: true
  cliniq_documents:
    name: cliniq_cliniq_documents
    external: true
  cliniq_uploads:
    name: cliniq_cliniq_uploads
    external: true
  cliniq_backups:
    name: cliniq_cliniq_backups
    external: true
  cliniq_sessions:
    name: cliniq_cliniq_sessions
    external: true
  cliniq_load_test_results:
    name: cliniq_load_test_results

networks:
  cliniq_internal:
    driver: bridge
